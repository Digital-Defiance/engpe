[package]
name = "engpe-clinic"
version = "0.1.0"
description = "Stateless ENGPE clinical desktop (air-gapped FHE PRS)"
authors = ["engpe"]
edition = "2021"

[lib]
name = "engpe_clinic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
engpe-native = { path = "../../native" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
